<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>CodeArena - 登录</title>
    <style>
        .error { color: #b91c1c; }
        .success { color: #15803d; }
    </style>
</head>

<body>

<h1>CodeArena</h1>

<p>在线编程判题平台</p>

<input id="username" type="text" placeholder="用户名">

<br><br>

<input id="password" type="password" placeholder="密码">

<br><br>

<button id="loginButton" type="button" onclick="login()">登录</button>

<p id="message"></p>

<p>
    还没有账号？
    <a href="/register.html">立即注册</a>
</p>

<script>
    // 相对路径：通过 Spring Boot 打开页面（http://localhost:8080/login.html）时，
    // 会自动使用当前协议、域名和端口，不再硬编码 localhost:8080。
    const LOGIN_API = "/api/auth/login";

    function setMessage(text, type) {
        const element = document.getElementById("message");
        element.textContent = text;
        element.className = type || "";
    }

    // 后端失败信息是纯文本（例如“密码错误”），但 400/500 走全局异常处理时是 Result JSON。
    function describeBody(body) {
        if (!body) {
            return "";
        }
        try {
            const json = JSON.parse(body);
            if (json && typeof json.message === "string") {
                return json.message;
            }
        } catch (error) {
            // 不是 JSON，按纯文本处理
        }
        if (body.startsWith("<")) {
            return "服务端返回的是 HTML 页面，不是登录接口的结果";
        }
        return body.replace(/\s+/g, " ").trim().slice(0, 200);
    }

    // /api/auth/login 成功时返回的是 JWT 纯文本，形如 header.payload.signature
    function isJwt(text) {
        return text.startsWith("eyJ") && text.split(".").length === 3;
    }

    async function login() {

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            setMessage("请输入用户名和密码", "error");
            return;
        }

        // 直接双击打开 HTML 文件时协议是 file:，相对路径无法访问后端接口。
        if (window.location.protocol === "file:") {
            setMessage("当前页面是以文件方式打开的，无法访问后端接口。请通过 Spring Boot 打开：http://localhost:8080/login.html", "error");
            return;
        }

        const button = document.getElementById("loginButton");
        button.disabled = true;
        setMessage("正在登录…");

        try {

            const response = await fetch(LOGIN_API, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const body = (await response.text()).trim();
            const detail = describeBody(body);

            if (response.status === 404) {
                setMessage("请求接口不存在（HTTP 404）：" + LOGIN_API + "。当前页面来源是 " + window.location.origin + "，请通过 Spring Boot 打开 http://localhost:8080/login.html。", "error");
                return;
            }

            if (response.status === 401) {
                setMessage(detail || "用户名或密码错误", "error");
                return;
            }

            if (response.status === 400) {
                setMessage("请求参数不合法（HTTP 400）" + (detail ? "：" + detail : ""), "error");
                return;
            }

            if (response.status >= 500) {
                setMessage("服务器内部错误（HTTP " + response.status + "）" + (detail ? "：" + detail : "") + "，请查看 IDEA 控制台日志。", "error");
                return;
            }

            if (!response.ok) {
                setMessage("登录失败（HTTP " + response.status + "）" + (detail ? "：" + detail : ""), "error");
                return;
            }

            if (isJwt(body)) {
                localStorage.setItem("token", body);
                setMessage("登录成功，正在进入题目中心…", "success");
                window.location.href = "/problem-list.html";
                return;
            }

            if (body.includes("用户不存在") || body.includes("密码错误")) {
                setMessage("用户名或密码错误", "error");
                return;
            }

            // 兼容后端以后把接口改成返回 Result JSON（{code,message,data}）的情况
            try {
                const json = JSON.parse(body);
                if (json && typeof json.data === "string" && isJwt(json.data)) {
                    localStorage.setItem("token", json.data);
                    setMessage("登录成功，正在进入题目中心…", "success");
                    window.location.href = "/problem-list.html";
                    return;
                }
            } catch (error) {
                // 不是 JSON，继续按纯文本判断
            }

            if (!body) {
                setMessage("返回数据格式异常：服务端返回了空内容，请查看后端日志。", "error");
                return;
            }

            setMessage("返回数据格式异常：无法识别的返回内容（" + detail + "），请确认接口地址与后端返回格式。", "error");

        } catch (error) {

            // fetch 只有在网络层失败时才抛出异常：后端未启动、端口不通、连接被拒绝等
            console.error(error);
            setMessage("无法连接到服务器，请确认 Spring Boot 已启动（http://localhost:8080）。", "error");

        } finally {
            button.disabled = false;
        }
    }
</script>

</body>

</html>
