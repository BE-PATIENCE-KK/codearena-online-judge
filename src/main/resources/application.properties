server.port=8080

spring.datasource.url=${CODEARENA_DB_URL:jdbc:mysql://localhost:3306/codearena?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${CODEARENA_DB_USERNAME}
spring.datasource.password=${CODEARENA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.codearena.codearena.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Keep the Day 6 submission table aligned for each local startup.
spring.sql.init.mode=always

# Day 8 判题配置
# 每次提交的临时目录都建在 judge.temp-dir 下面，判题结束后删除
judge.temp-dir=${java.io.tmpdir}/codearena-judge
# 题目没有配置 time_limit 时使用的默认时间限制（毫秒）
judge.default-time-limit=2000
