# Reference configuration only. The application reads database credentials
# and the JWT signing key from environment variables; keep real values there.
server:
  port: 8080

spring:
  datasource:
    url: ${CODEARENA_DB_URL:jdbc:mysql://localhost:3306/codearena?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${CODEARENA_DB_USERNAME}
    password: ${CODEARENA_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.codearena.codearena.entity
  configuration:
    map-underscore-to-camel-case: true

judge:
  temp-dir: ${java.io.tmpdir}/codearena-judge
  default-time-limit: 2000
